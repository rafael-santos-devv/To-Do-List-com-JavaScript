<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembretes RF</title>
    
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/js/scripts.js" defer></script>
</head>
<body>
   <div class="todo-container">
    <header>
        <h1>Lembretes</h1>
    <input type="checkbox" id="theme-toggle-check" style="display: none;">
    <label for="theme-toggle-check" id="theme-toggle">🌙</label>   
 </header>

    <form id="todo-form">
        <p>Adicione sua tarefa:</p>
        <div class="form-control">
            <input type="text" id="todo-input" placeholder="digite aqui">
            <button type="submit">
                <i class="fa-solid fa-plus"></i>
            </button>
            <hr>
        </div>
    </form>

    <form id="edit-form" class="hide">
        <p>Edite sua tarefa:</p>
        <div class="form-control">
            <input type="text" id="edit-input"/>
            <button type="submit">
                <i class="fa-solid fa-check-double"></i>
            </button>
        </div>
        <button id="cancel-edit-btn">Cancelar</button>
        <hr>
    </form>

    

    <div id="todo-list"></div>

    <nav class="auth-links" aria-label="Acesso à conta">
        <a href="/login.html">Login</a>
        <a href="/cadastro.html">Criar conta</a>
    </nav>
   </div>
</body>
</html>
