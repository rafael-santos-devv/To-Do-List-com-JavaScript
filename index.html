<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembretes RF</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- JavaScript -->
    <script src="/js/scripts.js" defer></script>
</head>
<body>
   <div class="todo-container">
    <header>
        <h1>Lembretes</h1>
    <input type="checkbox" id="theme-toggle-check" style="display: none;">
    <label for="theme-toggle-check" id="theme-toggle">🌙</label>   
 </header>

    <form id="todo-form">
        <p>Adicione sua tarefa:</p>
        <div class="form-control">
            <input type="text" id="todo-input" placeholder="digite aqui">
            <button type="submit">
                <i class="fa-solid fa-plus"></i>
            </button>
            <hr>
        </div>
    </form>

    <form id="edit-form" class="hide">
        <p>Edite sua tarefa:</p>
        <div class="form-control">
            <input type="text" id="edit-input"/>
            <button type="submit">
                <i class="fa-solid fa-check-double"></i>
            </button>
        </div>
        <button id="cancel-edit-btn">Cancelar</button>
        <hr>
    </form>

    <div id="toolbar">
        <div id="search">
            <h4>Pesquisar tarefas...</h4>
            <form>
                <input type="text" id="search-input" placeholder="busque por título">
                <button id="eraser-button">
                    <i class="fa-solid fa-delete-left"></i>
                </button>
            </form>
        </div>
        <div id="filter">
            <h4>Filtrar tarefas...</h4>
            <select id="filter-select">
                <option value="all">Todos</option>
                <option value="completed">Completas</option>
                <option value="incomplete">Incompletas</option>
            </select>
        </div>
    </div>

    <div id="todo-list">
        <div class="todo done">
           <h3>Estou fazendo alguma coisa...</h3>
           <button class="finish-todo">
            <i class="fa-solid fa-check"></i>
           </button>
            <button class="edit-todo">
            <i class="fa-solid fa-pen"></i>
           </button>
            <button class="remove-todo">
            <i class="fa-solid fa-xmark"></i>
           </button>
        </div>
        <div class="todo">
           <h3>Estou fazendo alguma coisa2...</h3>
           <button class="finish-todo">
            <i class="fa-solid fa-check"></i>
           </button>
            <button class="edit-todo">
            <i class="fa-solid fa-pen"></i>
           </button>
            <button class="remove-todo">
            <i class="fa-solid fa-xmark"></i>
           </button>
        </div>
    </div>

   </div>
</body>
</html>
