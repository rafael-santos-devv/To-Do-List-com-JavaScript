<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lembretes RF</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/auth.js" defer></script>
</head>
<body>
    <main class="todo-container">
        <header>
            <h1>Entrar</h1>
            <input type="checkbox" id="theme-toggle-check" style="display: none;">
            <label for="theme-toggle-check" id="theme-toggle">🌙</label>
        </header>
        <form class="auth-form" action="#" method="post">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>
        <p class="auth-note">Ainda não tem uma conta? <a href="/cadastro.html">Cadastre-se</a></p>
        <nav class="auth-links" aria-label="Navegação">
            <a href="/index.html">Voltar às tarefas</a>
        </nav>
    </main>
</body>
</html>
